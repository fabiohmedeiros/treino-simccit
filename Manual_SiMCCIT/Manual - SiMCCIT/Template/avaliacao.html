<!DOCTYPE html>
<html lang="pt-BR">

<title>Avaliação — SiMCCIT</title>

<!--
================================================================================

   SiMCCIT — TEMPLATE GERAL DE AVALIAÇÃO POR ENSAIOS

   Arquivo único, sem internet e sem instalação: abre com duplo clique.
   Cada projeto derivado (um eixo, um recorte de categorias) é uma CÓPIA deste
   arquivo com o bloco editável trocado.

   Para adaptar: role até "BLOCO EDITÁVEL" logo abaixo. É a única parte a mexer.
   Instruções completas de derivação estão no README.md da pasta principal.

================================================================================
-->

<script>
/* ============================================================================
   ██  BLOCO EDITÁVEL — INÍCIO  ███████████████████████████████████████████████

   Três seções, nesta ordem:
     1. CONFIG      — títulos e textos da sessão
     2. CATEGORIAS  — as alternativas E o conteúdo do guia (mesma fonte)
     3. ENSAIOS     — os itens aplicados, na ordem

   MARCAÇÃO DISPONÍVEL NOS TEXTOS
     <br>                               quebra de linha
     <strong>texto</strong>             negrito
     <em>texto</em>                     itálico
     <span class="destaque">x</span>    realce amarelo
     <span class="destaque-a">x</span>  realce azul
     <span class="destaque-b">x</span>  realce verde
   ========================================================================= */


/* ---------------------------------------------------------------------------
   1. CONFIGURAÇÃO
   --------------------------------------------------------------------------- */

const CONFIG = {

  titulo: "EXEMPLO — substituir pelo título do projeto",

  // Pergunta padrão de todos os ensaios. Um ensaio pode ter a sua própria,
  // se precisar (campo "pergunta").
  perguntaPadrao: "A categoria que corresponde ao trecho é:",

  // Embaralha a ordem dos botões dentro de cada ensaio.
  embaralharOpcoes: true,

  // Exige escolha antes de liberar "Próxima".
  exigirResposta: true,

  mostrarProgresso: true,

  // Largura mínima de cada botão. Define quantos cabem por linha:
  // valores menores = mais colunas. Útil quando o eixo tem muitas categorias.
  larguraMinimaOpcao: "15rem",

  instrucoes: `
    <p>Nesta avaliação, você verá uma série de trechos de interação entre
    terapeuta e cliente.</p>

    <p>Em cada tela, leia o material apresentado e escolha, entre as
    alternativas, a categoria correspondente. Clique na alternativa desejada —
    ela ficará destacada — e depois clique em <strong>Próxima</strong> para
    seguir. Você pode trocar de alternativa antes de avançar.</p>

    <p>Não há limite de tempo: responda no seu ritmo. <strong>Não é possível
    voltar</strong> a um trecho já respondido, e você <strong>não receberá
    retorno</strong> sobre suas escolhas.</p>

    <p>A qualquer momento, consulte as definições de todas as categorias
    clicando no ícone de livro no canto inferior direito da tela.</p>
  `,

  encerramento: `
    <p>Suas respostas foram registradas. Obrigado por participar!</p>
  `
};


/* ---------------------------------------------------------------------------
   2. CATEGORIAS

   Esta lista tem DUAS funções ao mesmo tempo:
     - é o conjunto de alternativas exibido em todo ensaio;
     - é o conteúdo do guia de consulta.
   Por isso o "rotulo" precisa ser escrito uma vez só e usado tal e qual no
   campo "gabarito" dos ensaios.

   CAMPOS
     rotulo     (obrigatório) Texto do botão e título no guia.
     definicao  (obrigatório) Caracterização da categoria, exibida no guia.
     criterio   (opcional)    Critérios de inclusão/exclusão.
     exemplos   (opcional)    Lista de exemplos exibidos no guia.
     grupo      (opcional)    Cria abas no guia (ex.: "Terapeuta"/"Cliente").
                              Com um grupo só, ou nenhum, o guia não usa abas.
   --------------------------------------------------------------------------- */

const CATEGORIAS = [
  {
    rotulo: "Relato (REL)",
    definicao: `Contempla verbalizações em que o cliente descreve ou informa o
                terapeuta sobre a ocorrência de eventos, respostas emocionais,
                estados motivacionais e/ou tendências a ações, sem estabelecer
                relações causais ou funcionais entre eles.`,
    exemplos: [
      `C: "Estou triste, T. To mal... To perdidinha de novo..."`,
      `C: "Naquela hora eu só queria gritar e sair correndo dali..."`
    ]
  },
  {
    rotulo: "Relações (CER)",
    definicao: `É caracterizada por verbalizações em que o cliente estabelece
                relações causais e/ou explicativas (funcionais, correlacionais
                ou de contiguidade) entre eventos.`,
    exemplos: [
      `C: "Eu acho que eu trabalho tanto porque assim eu evito discussões em casa."`
    ]
  },
  {
    rotulo: "Metas (MET)",
    definicao: `Contempla verbalizações do cliente nas quais ele descreve seus
                projetos, planos ou estratégias para a solução de problemas
                trazidos como queixas para a terapia.`,
    criterio: `Refere-se a ação futura. Ação já executada é Relato (REL).`,
    exemplos: [
      `C: "Vou ligar para ela e conversar sobre o que aconteceu."`
    ]
  }
];


/* ---------------------------------------------------------------------------
   3. ENSAIOS

   Aplicados na ordem em que aparecem. Separe cada um com vírgula.

   CAMPOS
     id         (obrigatório) Código único, vai para o relatório.
     enunciado  (obrigatório) O material apresentado. Aceita HTML.
     gabarito   (obrigatório) Igual, caractere por caractere, a um "rotulo"
                              de CATEGORIAS. Omita para não corrigir o ensaio.
     pergunta   (opcional)    Sobrepõe CONFIG.perguntaPadrao neste ensaio.
     opcoes     (opcional)    Sobrepõe a lista de CATEGORIAS neste ensaio.
                              Use só em ensaios de formato diferente.
     colunas    (opcional)    1, 2, 3... ou "auto" (padrão).
   --------------------------------------------------------------------------- */

const ENSAIOS = [

  {
    id: "E01",
    enunciado: `T: E o que você fez depois disso?<br>
                <strong>C: Eu fiquei em casa o dia todo. Não quis ver ninguém,
                não atendi o telefone.</strong>`,
    gabarito: "Relato (REL)"
  },

  {
    id: "E02",
    enunciado: `T: Como você pretende resolver isso?<br>
                <strong>C: Vou ligar para ela e conversar sobre o que
                aconteceu.</strong>`,
    gabarito: "Metas (MET)"
  }

  /* ↓↓↓ Cole os próximos ensaios aqui. Não esqueça a vírgula acima. ↓↓↓ */

];

/* ██  BLOCO EDITÁVEL — FIM  ██████████████████████████████████████████████████
   Daqui para baixo é o funcionamento do aplicativo. Não altere.
   ========================================================================= */
</script>

<style>
:root {
  --primaria: #4f46e5;
  --secundaria: #7c3aed;
  --texto-escuro: #334155;
  --texto-claro: #64748b;
  --fundo-claro: #f1f5f9;
  --borda: #cbd5e1;
  --selecao: #4f46e5;
  --selecao-fundo: #eef2ff;
  --largura-opcao: 15rem;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin: 0; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(to bottom right, #e0f2fe, #e0e7ff);
  color: #1e293b; padding: 1rem;
}

#app { width: 100%; max-width: 60rem; margin: 0 auto; }
.oculto, .hidden { display: none !important; }

.cartao {
  background-color: rgba(255, 255, 255, 0.92);
  border-radius: 1rem; padding: 2rem 2.5rem;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
}

h1.titulo {
  font-size: 1.875rem; line-height: 1.25; color: #1e3a8a;
  margin: 0 0 1.5rem; text-align: center;
}

.botao-primario {
  background: linear-gradient(to right, var(--primaria), var(--secundaria));
  color: white; font-weight: bold; font-size: 1rem;
  padding: 0.75rem 2rem; border-radius: 0.5rem; border: none; cursor: pointer;
  font-family: inherit;
  transition: transform 0.2s ease; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}
.botao-primario:hover:not(:disabled) { transform: scale(1.04); }
.botao-primario:disabled { background: var(--borda); cursor: not-allowed; box-shadow: none; }

.barra-topo {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 1.25rem; color: var(--texto-claro);
  font-size: 0.95rem; font-weight: 500;
}
.barra-progresso {
  height: 6px; background: var(--fundo-claro);
  border-radius: 999px; overflow: hidden; margin-bottom: 1.5rem;
}
.barra-progresso > div {
  height: 100%;
  background: linear-gradient(to right, var(--primaria), var(--secundaria));
  transition: width 0.3s ease;
}

#enunciado {
  background-color: rgba(255,255,255,0.7); border: 1px solid #e2e8f0;
  padding: 1.5rem; border-radius: 0.5rem;
  font-size: 1.125rem; line-height: 1.75; text-align: left;
  box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.04);
}
#pergunta {
  margin: 1.5rem 0 1rem; font-weight: 600; font-size: 1.05rem;
  text-align: center; color: var(--texto-escuro);
}

/* auto-fit acomoda de 2 a 16+ alternativas sem configuração manual */
#opcoes { display: grid; gap: 0.75rem;
  grid-template-columns: repeat(auto-fit, minmax(var(--largura-opcao), 1fr)); }
#opcoes.colunas-1 { grid-template-columns: 1fr; }
#opcoes.colunas-2 { grid-template-columns: repeat(2, 1fr); }
#opcoes.colunas-3 { grid-template-columns: repeat(3, 1fr); }

.opcao {
  background-color: white; border: 2px solid var(--borda);
  border-radius: 0.5rem; padding: 0.875rem 1rem;
  font-size: 1rem; font-family: inherit; line-height: 1.5;
  color: var(--texto-escuro); text-align: left; cursor: pointer;
  transition: border-color 0.15s, background-color 0.15s;
}
.opcao:hover { border-color: var(--primaria); }
/* Seleção deliberadamente NEUTRA: indica escolha, não acerto. */
.opcao.selecionada {
  border-color: var(--selecao); background-color: var(--selecao-fundo);
  font-weight: 600;
}
.opcao:focus-visible { outline: 3px solid var(--secundaria); outline-offset: 2px; }

.rodape-ensaio { margin-top: 1.75rem; text-align: center; }

.destaque   { background-color: #fef08a; padding: 0.1em 0.2em; border-radius: 0.2em; }
.destaque-a { background-color: #bfdbfe; padding: 0.1em 0.2em; border-radius: 0.2em; }
.destaque-b { background-color: #bbf7d0; padding: 0.1em 0.2em; border-radius: 0.2em; }

#tela-final { text-align: center; }
#campo-codigo {
  width: 100%; max-width: 20rem; padding: 0.75rem 1rem;
  font-size: 1rem; font-family: inherit;
  border: 2px solid var(--borda); border-radius: 0.5rem; text-align: center;
}
#campo-codigo:focus { outline: none; border-color: var(--primaria); }
.caixa-pesquisador {
  margin-top: 2rem; padding: 1.5rem; background-color: var(--fundo-claro);
  border: 1px dashed var(--borda); border-radius: 0.75rem;
}
.rotulo-pesquisador {
  font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--texto-claro); font-weight: 700; margin: 0 0 0.75rem;
}
.aviso { margin-top: 1rem; font-size: 0.9rem; color: var(--texto-claro); min-height: 1.25rem; }

.guide-fab {
  position: fixed; bottom: 1.5rem; right: 1.5rem;
  width: 4rem; height: 4rem; border-radius: 50%;
  background: linear-gradient(to right, var(--primaria), var(--secundaria));
  color: white; border: none; cursor: pointer;
  box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; transition: transform 0.2s ease;
}
.guide-fab:hover { transform: scale(1.1); }
.guide-modal-overlay {
  position: fixed; inset: 0; background-color: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 1001; padding: 1rem;
}
.guide-container {
  background-color: white; border-radius: 1rem; padding: 2rem;
  width: 100%; max-width: 50rem; max-height: 90vh;
  overflow-y: auto; position: relative; text-align: left;
}
.guide-close-btn {
  position: sticky; top: -1rem; float: right;
  background: white; border-radius: 50%; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  margin-right: -1rem; border: none; font-size: 2rem; cursor: pointer;
  color: var(--texto-claro); line-height: 1; z-index: 2;
}
.guide-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap;
  border-bottom: 1px solid var(--borda); margin-bottom: 1.5rem; }
.guide-tab-btn {
  padding: 0.75rem 1.25rem; border: none; background: none; cursor: pointer;
  font-size: 1.125rem; font-weight: 600; font-family: inherit;
  color: var(--texto-claro); border-bottom: 3px solid transparent; transition: all 0.2s;
}
.guide-tab-btn.active { color: var(--primaria); border-bottom-color: var(--primaria); }
.guide-category {
  margin-bottom: 1.5rem; padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--fundo-claro);
}
.guide-category:last-child { border-bottom: none; margin-bottom: 0; }
.guide-category h3 {
  font-size: 1.25rem; color: var(--texto-escuro); margin: 0 0 0.5rem;
}
.guide-category p { font-size: 1rem; line-height: 1.6; color: var(--texto-claro); margin: 0; }
.guide-criterio {
  margin-top: 0.75rem; padding: 0.75rem; border-radius: 0.375rem;
  background-color: #fffbeb; border-left: 3px solid #fbbf24;
  font-size: 0.95rem !important; color: var(--texto-escuro) !important;
}
.guide-criterio strong { display: block; margin-bottom: 0.25rem; font-size: 0.85rem;
  text-transform: uppercase; letter-spacing: 0.04em; color: #92400e; }
.guide-examples { margin-top: 1rem; padding-left: 1rem; border-left: 3px solid #e2e8f0; }
.guide-examples-title {
  font-weight: 600; color: var(--texto-escuro);
  font-size: 0.9rem; margin: 0 0 0.5rem;
}
.guide-example {
  background-color: var(--fundo-claro); padding: 0.75rem; border-radius: 0.375rem;
  margin-bottom: 0.5rem !important; font-style: italic;
  color: var(--texto-escuro) !important;
}
.guide-example:last-child { margin-bottom: 0 !important; }

@media (max-width: 640px) {
  body { padding: 0.5rem; }
  .cartao { padding: 1.25rem 1rem; }
  h1.titulo { font-size: 1.375rem; }
  #opcoes, #opcoes.colunas-2, #opcoes.colunas-3 { grid-template-columns: 1fr; }
  #enunciado { padding: 1rem; font-size: 1rem; }
  .guide-container { padding: 1.25rem; }
  .guide-fab { width: 3.25rem; height: 3.25rem; bottom: 1rem; right: 1rem; }
}
</style>
</head>
<body>

<div id="app">

  <section id="tela-instrucoes" class="cartao">
    <h1 class="titulo" id="titulo-instrucoes"></h1>
    <div id="texto-instrucoes" style="color: var(--texto-escuro); font-size: 1.05rem; line-height: 1.7;"></div>
    <div style="text-align: center; margin-top: 2rem;">
      <button id="btn-iniciar" class="botao-primario">Iniciar</button>
    </div>
  </section>

  <section id="tela-ensaio" class="cartao oculto">
    <div class="barra-topo"><span id="indicador-progresso"></span></div>
    <div class="barra-progresso"><div id="preenchimento-progresso" style="width: 0%"></div></div>
    <div id="enunciado"></div>
    <p id="pergunta"></p>
    <div id="opcoes" role="radiogroup" aria-label="Alternativas"></div>
    <div class="rodape-ensaio">
      <button id="btn-proxima" class="botao-primario">Próxima</button>
      <p class="aviso" id="aviso-ensaio"></p>
    </div>
  </section>

  <section id="tela-final" class="cartao oculto">
    <h1 class="titulo" style="color: var(--primaria);">Avaliação concluída</h1>
    <div id="texto-encerramento" style="color: var(--texto-escuro); font-size: 1.1rem;"></div>
    <div class="caixa-pesquisador">
      <p class="rotulo-pesquisador">Para o pesquisador responsável</p>
      <label for="campo-codigo" style="display:block; margin-bottom:0.5rem; color:var(--texto-claro);">
        Código de identificação do participante
      </label>
      <input type="text" id="campo-codigo" placeholder="ex.: P07" autocomplete="off">
      <div style="margin-top: 1.25rem;">
        <button id="btn-baixar" class="botao-primario">Salvar respostas (.csv)</button>
      </div>
      <p class="aviso" id="aviso-final"></p>
    </div>
  </section>

</div>

<button id="btn-guia" class="guide-fab" aria-label="Abrir guia de categorias" title="Guia de categorias">
  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
</button>

<div id="modal-guia" class="guide-modal-overlay oculto">
  <div class="guide-container">
    <button id="fechar-guia" class="guide-close-btn" aria-label="Fechar guia">&times;</button>
    <div class="guide-tabs" id="guia-abas"></div>
    <div id="guia-conteudo"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const CHAVE_ARMAZENAMENTO = "simccit_avaliacao_v1";

  let indice = 0;
  let escolhaAtual = null;
  let inicioEnsaio = 0;
  let respostas = [];
  let opcoesEmOrdem = [];
  let emAndamento = false;

  const el = (id) => document.getElementById(id);
  const telaInstrucoes = el("tela-instrucoes");
  const telaEnsaio     = el("tela-ensaio");
  const telaFinal      = el("tela-final");
  const caixaOpcoes    = el("opcoes");
  const btnProxima     = el("btn-proxima");
  const avisoEnsaio    = el("aviso-ensaio");

  /* Alternativas de um ensaio: as próprias, se declaradas; senão, todas
     as CATEGORIAS do projeto. É a regra que dispensa repetir as opções
     em cada linha do CSV. */
  function opcoesDe(ensaio) {
    return ensaio.opcoes ? ensaio.opcoes : CATEGORIAS.map((c) => c.rotulo);
  }

  function embaralhar(lista) {
    const copia = lista.slice();
    for (let i = copia.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
  }

  function mostrarTela(tela) {
    [telaInstrucoes, telaEnsaio, telaFinal].forEach((t) => {
      t.classList.toggle("oculto", t !== tela);
    });
    window.scrollTo(0, 0);
  }

  function agoraISO() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ` +
           `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  /* --------------------------------------------------------------------
     VALIDAÇÃO
     Roda antes de qualquer coisa. Erros de digitação no bloco editável
     aparecem aqui, e não no meio de uma coleta.
     -------------------------------------------------------------------- */
  function validar() {
    const problemas = [];

    if (!Array.isArray(CATEGORIAS) || CATEGORIAS.length < 2) {
      problemas.push("CATEGORIAS precisa ter pelo menos 2 categorias.");
    } else {
      const rotulos = new Set();
      CATEGORIAS.forEach((c, i) => {
        const onde = `Categoria ${i + 1} (${c && c.rotulo ? c.rotulo : "sem rotulo"})`;
        if (!c.rotulo) problemas.push(`${onde}: falta o campo "rotulo".`);
        else if (rotulos.has(c.rotulo)) problemas.push(`${onde}: rótulo repetido.`);
        else rotulos.add(c.rotulo);
        if (!c.definicao) problemas.push(`${onde}: falta o campo "definicao" (usado no guia).`);
      });
    }

    if (!Array.isArray(ENSAIOS) || ENSAIOS.length === 0) {
      problemas.push("A lista ENSAIOS está vazia.");
      return problemas;
    }

    const ids = new Set();
    ENSAIOS.forEach((e, i) => {
      const onde = `Ensaio ${i + 1} (id: ${e && e.id ? e.id : "sem id"})`;
      if (!e.id) problemas.push(`${onde}: falta o campo "id".`);
      else if (ids.has(e.id)) problemas.push(`${onde}: o id "${e.id}" está repetido.`);
      else ids.add(e.id);

      if (!e.enunciado) problemas.push(`${onde}: falta o campo "enunciado".`);

      const opcoes = opcoesDe(e);
      if (!Array.isArray(opcoes) || opcoes.length < 2) {
        problemas.push(`${onde}: precisa de pelo menos 2 alternativas.`);
        return;
      }
      if (new Set(opcoes).size !== opcoes.length) {
        problemas.push(`${onde}: há alternativas repetidas.`);
      }
      if (e.gabarito !== undefined && !opcoes.includes(e.gabarito)) {
        problemas.push(`${onde}: o gabarito "${e.gabarito}" não corresponde ` +
          `exatamente a nenhuma categoria. Confira acentos, espaços e a sigla.`);
      }
    });

    return problemas;
  }

  function exibirErros(problemas) {
    telaInstrucoes.innerHTML =
      `<h1 class="titulo" style="color:#b91c1c;">Erro na configuração</h1>
       <p style="color:var(--texto-escuro);">Corrija os pontos abaixo no bloco
       editável do arquivo e recarregue a página. A avaliação não foi iniciada.</p>
       <ul style="color:#b91c1c; line-height:1.8; text-align:left;">
         ${problemas.map((p) => `<li>${p}</li>`).join("")}
       </ul>`;
    mostrarTela(telaInstrucoes);
  }

  /* --------------------------------------------------------------------
     PERSISTÊNCIA
     -------------------------------------------------------------------- */
  function salvar() {
    try {
      localStorage.setItem(CHAVE_ARMAZENAMENTO, JSON.stringify({
        indice: indice, respostas: respostas, atualizadoEm: agoraISO()
      }));
    } catch (erro) { /* modo privativo: segue sem retomada automática */ }
  }
  function limparSalvo() {
    try { localStorage.removeItem(CHAVE_ARMAZENAMENTO); } catch (erro) {}
  }
  function lerSalvo() {
    try {
      const bruto = localStorage.getItem(CHAVE_ARMAZENAMENTO);
      if (!bruto) return null;
      const d = JSON.parse(bruto);
      if (!d || !Array.isArray(d.respostas) || d.respostas.length === 0) return null;
      return d;
    } catch (erro) { return null; }
  }

  /* --------------------------------------------------------------------
     ENSAIO
     -------------------------------------------------------------------- */
  function renderizarEnsaio() {
    const ensaio = ENSAIOS[indice];
    escolhaAtual = null;
    avisoEnsaio.textContent = "";

    el("enunciado").innerHTML = ensaio.enunciado;
    el("pergunta").innerHTML = ensaio.pergunta || CONFIG.perguntaPadrao;

    el("indicador-progresso").textContent = CONFIG.mostrarProgresso
      ? `Ensaio ${indice + 1} de ${ENSAIOS.length}` : "";
    el("preenchimento-progresso").style.width = `${(indice / ENSAIOS.length) * 100}%`;

    const deveEmbaralhar = ensaio.embaralharOpcoes !== undefined
      ? ensaio.embaralharOpcoes : CONFIG.embaralharOpcoes;
    const base = opcoesDe(ensaio);
    opcoesEmOrdem = deveEmbaralhar ? embaralhar(base) : base.slice();

    caixaOpcoes.className = (ensaio.colunas && ensaio.colunas !== "auto")
      ? `colunas-${ensaio.colunas}` : "";
    caixaOpcoes.innerHTML = "";

    opcoesEmOrdem.forEach((texto) => {
      const botao = document.createElement("button");
      botao.type = "button";
      botao.className = "opcao";
      botao.innerHTML = texto;
      botao.setAttribute("role", "radio");
      botao.setAttribute("aria-checked", "false");
      botao.addEventListener("click", () => selecionar(texto, botao));
      caixaOpcoes.appendChild(botao);
    });

    btnProxima.disabled = CONFIG.exigirResposta;
    btnProxima.textContent = (indice === ENSAIOS.length - 1) ? "Finalizar" : "Próxima";
    inicioEnsaio = Date.now();
  }

  /* Seleção SEM feedback: marca a escolha e permite trocar. */
  function selecionar(texto, botao) {
    escolhaAtual = texto;
    caixaOpcoes.querySelectorAll(".opcao").forEach((b) => {
      const ativo = b === botao;
      b.classList.toggle("selecionada", ativo);
      b.setAttribute("aria-checked", ativo ? "true" : "false");
    });
    btnProxima.disabled = false;
    avisoEnsaio.textContent = "";
  }

  function avancar() {
    if (CONFIG.exigirResposta && escolhaAtual === null) {
      avisoEnsaio.textContent = "Escolha uma alternativa para continuar.";
      return;
    }

    const ensaio = ENSAIOS[indice];
    const latencia = ((Date.now() - inicioEnsaio) / 1000).toFixed(2);
    const semResposta = escolhaAtual === null;

    let resultado;
    if (ensaio.gabarito === undefined)         resultado = "sem gabarito";
    else if (semResposta)                      resultado = "sem resposta";
    else if (escolhaAtual === ensaio.gabarito) resultado = "Certo";
    else                                       resultado = "Errado";

    respostas.push({
      Ordem: indice + 1,
      EnsaioID: ensaio.id,
      Escolha: semResposta ? "" : escolhaAtual,
      Gabarito: ensaio.gabarito === undefined ? "" : ensaio.gabarito,
      Resultado: resultado,
      PosicaoEscolhida: semResposta ? "" : (opcoesEmOrdem.indexOf(escolhaAtual) + 1),
      TotalOpcoes: opcoesEmOrdem.length,
      Latencia_s: latencia,
      DataHora: agoraISO()
    });

    indice++;
    salvar();   // grava já apontando para o PRÓXIMO ensaio

    if (indice >= ENSAIOS.length) finalizar();
    else renderizarEnsaio();
  }

  function finalizar() {
    emAndamento = false;
    el("preenchimento-progresso").style.width = "100%";
    /* Nenhum escore é exibido: mostrar desempenho aqui seria feedback. */
    mostrarTela(telaFinal);
    el("campo-codigo").focus();
  }

  /* --------------------------------------------------------------------
     EXPORTAÇÃO
     -------------------------------------------------------------------- */
  function campoCsv(valor) {
    const t = String(valor === undefined || valor === null ? "" : valor);
    return /[",;\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }

  function sanitizarNome(t) {
    return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-zA-Z0-9_-]+/g, "_")
            .replace(/^_+|_+$/g, "").slice(0, 40);
  }

  function baixarCsv() {
    const bruto = el("campo-codigo").value.trim();
    if (!bruto) {
      el("aviso-final").textContent = "Informe o código do participante antes de salvar.";
      el("campo-codigo").focus();
      return;
    }
    const codigo = sanitizarNome(bruto) || "participante";
    const colunas = ["Participante", "Ordem", "EnsaioID", "Escolha", "Gabarito",
                     "Resultado", "PosicaoEscolhida", "TotalOpcoes",
                     "Latencia_s", "DataHora"];

    const linhas = [colunas.join(",")];
    respostas.forEach((r) => {
      linhas.push(colunas.map((c) =>
        campoCsv(c === "Participante" ? bruto : r[c])).join(","));
    });

    const blob = new Blob(["\uFEFF" + linhas.join("\r\n")],
                          { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const data = new Date().toISOString().slice(0, 10);
    const link = document.createElement("a");
    link.href = url;
    link.download = `${codigo}_${data}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    el("aviso-final").textContent = `Arquivo salvo como ${codigo}_${data}.csv`;
    limparSalvo();
  }

  /* --------------------------------------------------------------------
     GUIA — gerado a partir de CATEGORIAS, não escrito à mão.
     É o que permite ao mesmo template servir a qualquer eixo.
     -------------------------------------------------------------------- */
  function montarGuia() {
    const abas = el("guia-abas");
    const conteudo = el("guia-conteudo");
    const grupos = [];
    CATEGORIAS.forEach((c) => {
      const g = c.grupo || "";
      if (!grupos.includes(g)) grupos.push(g);
    });

    function secaoDe(grupo) {
      const div = document.createElement("div");
      div.className = "guide-section";
      CATEGORIAS.filter((c) => (c.grupo || "") === grupo).forEach((c) => {
        const bloco = document.createElement("div");
        bloco.className = "guide-category";

        const h = document.createElement("h3");
        h.textContent = c.rotulo;
        bloco.appendChild(h);

        const p = document.createElement("p");
        p.innerHTML = c.definicao;
        bloco.appendChild(p);

        if (c.criterio) {
          const cr = document.createElement("p");
          cr.className = "guide-criterio";
          cr.innerHTML = "<strong>Critérios de inclusão ou exclusão</strong>" + c.criterio;
          bloco.appendChild(cr);
        }
        if (Array.isArray(c.exemplos) && c.exemplos.length) {
          const cx = document.createElement("div");
          cx.className = "guide-examples";
          const t = document.createElement("h4");
          t.className = "guide-examples-title";
          t.textContent = "Exemplos:";
          cx.appendChild(t);
          c.exemplos.forEach((ex) => {
            const pe = document.createElement("p");
            pe.className = "guide-example";
            pe.innerHTML = ex;
            cx.appendChild(pe);
          });
          bloco.appendChild(cx);
        }
        div.appendChild(bloco);
      });
      return div;
    }

    const secoes = grupos.map(secaoDe);
    secoes.forEach((s, i) => {
      if (i > 0) s.classList.add("oculto");
      conteudo.appendChild(s);
    });

    // Abas só fazem sentido quando o eixo tem mais de um grupo.
    if (grupos.length > 1) {
      grupos.forEach((g, i) => {
        const b = document.createElement("button");
        b.className = "guide-tab-btn" + (i === 0 ? " active" : "");
        b.textContent = g || "Geral";
        b.addEventListener("click", () => {
          abas.querySelectorAll(".guide-tab-btn").forEach((x, j) =>
            x.classList.toggle("active", j === i));
          secoes.forEach((s, j) => s.classList.toggle("oculto", j !== i));
        });
        abas.appendChild(b);
      });
    } else {
      abas.classList.add("oculto");
    }
  }

  function configurarGuia() {
    const modal = el("modal-guia");
    montarGuia();
    el("btn-guia").addEventListener("click", () => modal.classList.remove("oculto"));
    el("fechar-guia").addEventListener("click", () => modal.classList.add("oculto"));
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.add("oculto");
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") modal.classList.add("oculto");
    });
  }

  /* Sem isto, o botão "voltar" do navegador burlaria a irreversibilidade. */
  function travarRetorno() {
    history.pushState(null, "", location.href);
    window.addEventListener("popstate", () => history.pushState(null, "", location.href));
    window.addEventListener("beforeunload", (e) => {
      if (!emAndamento) return;
      e.preventDefault();
      e.returnValue = "";
    });
  }

  function iniciarAvaliacao() {
    emAndamento = true;
    mostrarTela(telaEnsaio);
    renderizarEnsaio();
  }

  function inicializar() {
    const problemas = validar();
    if (problemas.length > 0) { exibirErros(problemas); return; }

    el("titulo-instrucoes").textContent = CONFIG.titulo;
    el("texto-instrucoes").innerHTML = CONFIG.instrucoes;
    el("texto-encerramento").innerHTML = CONFIG.encerramento;
    document.title = CONFIG.titulo;
    if (CONFIG.larguraMinimaOpcao) {
      document.documentElement.style.setProperty("--largura-opcao", CONFIG.larguraMinimaOpcao);
    }

    configurarGuia();
    travarRetorno();

    el("btn-iniciar").addEventListener("click", iniciarAvaliacao);
    btnProxima.addEventListener("click", avancar);
    el("btn-baixar").addEventListener("click", baixarCsv);
    el("campo-codigo").addEventListener("keydown", (e) => {
      if (e.key === "Enter") baixarCsv();
    });

    const salvo = lerSalvo();
    if (salvo) {
      const feitos = salvo.respostas.length;
      const texto = `Foi encontrada uma sessão interrompida, com ${feitos} ` +
        `${feitos === 1 ? "ensaio respondido" : "ensaios respondidos"} ` +
        `(${salvo.atualizadoEm}).\n\n` +
        `OK = retomar do ensaio ${Math.min(feitos + 1, ENSAIOS.length)}.\n` +
        `Cancelar = descartar e começar do zero.`;
      if (window.confirm(texto)) {
        respostas = salvo.respostas;
        // A contagem de respostas é a fonte de verdade: sobrevive a um
        // rascunho antigo ou corrompido, ao contrário do índice gravado.
        indice = Math.min(salvo.respostas.length, ENSAIOS.length);
        if (indice >= ENSAIOS.length) finalizar();
        else iniciarAvaliacao();
        return;
      }
      limparSalvo();
    }

    mostrarTela(telaInstrucoes);
  }

  document.addEventListener("DOMContentLoaded", inicializar);
})();
</script>
